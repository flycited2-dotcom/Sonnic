# Primary public domain. Cyrillic/www names redirect to the same session origin.
server {
    listen 80;
    server_name sonrazbor.ru www.sonrazbor.ru xn--80acrweekeb.xn--p1ai www.xn--80acrweekeb.xn--p1ai;
    access_log off;
    location /.well-known/acme-challenge/ { root /opt/sonnic/acme; }
    location / { return 308 https://sonrazbor.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.sonrazbor.ru xn--80acrweekeb.xn--p1ai www.xn--80acrweekeb.xn--p1ai;
    ssl_certificate /etc/letsencrypt/live/sonnic-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonnic-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    return 308 https://sonrazbor.ru$request_uri;
}
server {
    listen 443 ssl;
    server_name sonrazbor.ru;
    ssl_certificate /etc/letsencrypt/live/sonnic-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonnic-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:3180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
