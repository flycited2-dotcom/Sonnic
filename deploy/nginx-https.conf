server {
    listen 80;
    server_name sonnic.212.116.115.150.sslip.io;
    access_log off;
    location /.well-known/acme-challenge/ { root /opt/sonnic/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name sonnic.212.116.115.150.sslip.io;
    ssl_certificate /etc/letsencrypt/live/sonnic-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonnic-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:3180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
