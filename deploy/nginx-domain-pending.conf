# Before DNS/certificate activation, HTTP visitors use the existing HTTPS site.
# After DNS points to the VPS, certbot can validate both names through this root.
server {
    listen 80;
    server_name sonrazbor.ru www.sonrazbor.ru xn--80acrweekeb.xn--p1ai www.xn--80acrweekeb.xn--p1ai;
    access_log off;
    location /.well-known/acme-challenge/ { root /opt/sonnic/acme; }
    location / {
        return 302 https://sonnic.212.116.115.150.sslip.io$request_uri;
    }
}
